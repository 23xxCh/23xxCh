scene_name: office
description: 办公室环境，包含多个隔间和会议室，适合测试复杂室内导航和气体追踪
world: scenes/office/office.world
map: scenes/office/maps/office_map.yaml
nav2_params: scenes/office/nav2_params.yaml
use_gaden: true
use_slam: false
nav2_autostart: true
localizer_node: amcl
model_path: scenes/office/models
mission_manager:
  initial_pose:
    x: 0.0
    y: 0.0
    yaw: 0.0
  patrol_points:
  - - 2.0
    - 0.0
  - - 2.0
    - 3.0
  - - -2.0
    - 3.0
  - - -2.0
    - -3.0
  - - 0.0
    - -3.0
  enter_threshold: 0.5
  exit_threshold: 0.25
  source_threshold: 2.5
  confirm_samples: 2
  track_exit_samples: 3
  source_radius: 1.0
  source_hold_steps: 2
  track_step: 0.35
  sweep_angle_deg: 25.0
gas_source:
  x: 2.5
  y: 2.5
gaden:
  enabled: true
  project_path: /home/user/gaden_ws/install/test_env/share/test_env/scenarios/Exp_C/environment_configurations/config1
  playback_id: scene1
  player_freq: 1.0
  sensor_topic: /gaden/sensor_reading
  sensor_frame: base_link
  fixed_frame: gaden_map
  map_offset_x: 0.0
  map_offset_y: 0.0
  map_offset_z: 0.0
  map_roll: 0.0
  map_pitch: 0.0
  map_yaw: 0.0
gas_field:
  source_strength: 100.0
  decay_rate: 0.45
  plume_stddev: 1.0
  wind_x: 0.3
  wind_y: 0.1
  noise_stddev: 0.04
  publish_rate_hz: 5.0
