world: scenes/baseline/h2track_lab.world
map: maps/h2track_map.yaml
nav2_params: config/nav2_demo_params.yaml
scene_name: baseline
use_gaden: true
use_rviz: true
headless: false
mission_manager:
  initial_pose:
    x: 3.2
    y: 2.6
    yaw: 3.14159
  patrol_points:
  - - 2.6
    - 2.6
  - - 0.8
    - 2.4
  - - -1.8
    - 2.45
  - - -3.45
    - 2.45
  enter_threshold: 1.5
  exit_threshold: 0.6
  source_threshold: 4.5
  confirm_samples: 2
  track_exit_samples: 3
  source_radius: 1.0
  source_hold_steps: 2
  track_step: 0.4
  sweep_angle_deg: 30.0
gas_source:
  x: -4.0
  y: 1.95
gaden:
  enabled: true
  project_path: /home/user/gaden_ws/install/test_env/share/test_env/scenarios/Exp_C/environment_configurations/config1
  playback_id: scene1
  player_freq: 1.0
  sensor_topic: /gaden/sensor_reading
  sensor_frame: base_link
  fixed_frame: gaden_map
  map_offset_x: 2.5
  map_offset_y: 5.3
  map_offset_z: 0.0
  map_roll: 0.0
  map_pitch: 0.0
  map_yaw: 0.0
gas_field:
  source_strength: 120.0
  decay_rate: 0.55
  plume_stddev: 1.2
  wind_x: 0.4
  wind_y: 0.0
  noise_stddev: 0.05
  publish_rate_hz: 5.0
autonomy:
  slam_nav2_params: config/nav2_slam_baseline_params.yaml
  startup_gates:
    nav2_launch_delay: 0.0
    mission_manager_delay: 10.0
    nav2_startup_gate_timeout: 60.0
    gaden_sensor_gate_timeout: 60.0
    gaden_sensor_gate_poll_period: 0.5
    gaden_sensor_gate_stable_ready_count: 3
  mapping_detection:
    enter_threshold: 0.45
    exit_threshold: 0.2
    confirm_samples: 2
    min_explore_samples: 70
  tracking_handoff:
    source_x: -1.55
    source_y: 3.1
    enter_threshold: 1.0
    exit_threshold: 0.4
    source_threshold: 1.8
    confirm_samples: 2
    track_exit_samples: 5
    source_radius: 1.0
    source_hold_steps: 2
  tracking_nav2_overrides:
    bt_loop_duration: 50
    required_movement_radius: 0.1
    movement_time_allowance: 30.0
    desired_linear_vel: 0.16
  exploration:
    frontier_min_cluster_size: 6
    min_goal_distance: 0.8
    no_frontier_relaxed_after_cycles: 8
    no_frontier_relaxed_cluster_size: 1
    no_frontier_relaxed_min_goal_distance: 0.35
    control_period_sec: 1.0
    min_goal_x: -2.2
    max_goal_x: 5.2
    min_goal_y: -2.2
    max_goal_y: 5.0
