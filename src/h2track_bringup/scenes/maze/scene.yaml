scene_name: maze
description: 10x6m 迷宫环境，内部走廊和障碍物，使用 GADEN 10x6_maze 场景
world: scenes/maze/maze.world
map: scenes/maze/maps/maze_map.yaml
nav2_params: scenes/maze/nav2_params.yaml
use_gaden: true
use_slam: false
nav2_autostart: true
localizer_node: amcl
mission_manager:
  initial_pose:
    x: 0.5
    y: 1.0
    yaw: 0.0
  patrol_points:
  - - 2.0
    - 1.0
  - - 5.0
    - 1.0
  - - 8.0
    - 3.0
  - - 5.0
    - 5.0
  - - 2.0
    - 4.0
  enter_threshold: 0.5
  exit_threshold: 0.3
  source_threshold: 3.0
  confirm_samples: 2
  track_exit_samples: 3
  source_radius: 0.8
  source_hold_steps: 2
  track_step: 0.35
  sweep_angle_deg: 25.0
gas_source:
  x: 0.5
  y: 2.9
gaden:
  enabled: true
  project_path: /home/user/gaden_ws/install/test_env/share/test_env/scenarios/10x6_maze/environment_configurations/config1
  playback_id: scene1
  player_freq: 1.0
  sensor_topic: /gaden/sensor_reading
  sensor_frame: gas_sensor_link
  fixed_frame: gaden_map
  map_offset_x: 0.0
  map_offset_y: 0.0
  map_offset_z: 0.0
  map_roll: 0.0
  map_pitch: 0.0
  map_yaw: 0.0
gas_field:
  source_strength: 100.0
  decay_rate: 0.45
  plume_stddev: 1.0
  wind_x: 0.3
  wind_y: 0.0
  noise_stddev: 0.04
  gas_type: "H2"
  publish_rate_hz: 5.0
