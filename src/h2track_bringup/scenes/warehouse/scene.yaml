scene_name: warehouse
# NOTE: The h2track_warehouse GADEN scenario currently uses placeholder wind data
# borrowed from the 10x6_empty_room scenario. Gas dispersion patterns may not
# accurately reflect the warehouse geometry. A proper CFD simulation with the
# warehouse STL models would be needed for physically accurate wind fields.
world: scenes/warehouse/warehouse.world
map: scenes/warehouse/maps/warehouse_map.yaml
nav2_params: scenes/warehouse/nav2_params.yaml
use_gaden: true
use_slam: true
nav2_autostart: false
localizer_node: none
model_path: scenes/warehouse/models
upstream:
  name: aws-robomaker-small-warehouse-world
  license: MIT-0
  source: https://github.com/aws-robotics/aws-robomaker-small-warehouse-world
mission_manager:
  initial_pose:
    x: 0.5
    y: 1.0
    yaw: 0.0
  patrol_goal_timeout_sec: 70.0
  patrol_points:
  - - 1.5
    - 1.8
  - - 2.4
    - 1.1
  - - 2.9
    - -1.6
  - - 3.2
    - -2.45
  - - 3.48
    - -2.92
  enter_threshold: 0.65
  exit_threshold: 0.4
  source_threshold: 3.4
  confirm_samples: 1
  track_exit_samples: 3
  source_radius: 1.0
  source_hold_steps: 1
  track_step: 0.4
  sweep_angle_deg: 30.0
gas_source:
  x: 3.6
  y: -3.038551
gaden:
  enabled: true
  project_path: install/test_env/share/test_env/scenarios/h2track_warehouse/environment_configurations/config1
  playback_id: scene1
  player_freq: 0.5
  sensor_topic: /gaden/sensor_reading
  sensor_frame: gas_sensor_link
  fixed_frame: gaden_map
  map_offset_x: 0.0
  map_offset_y: 0.0
  map_offset_z: 0.0
  map_roll: 0.0
  map_pitch: 0.0
  map_yaw: 0.0
gas_field:
  source_strength: 200.0
  decay_rate: 0.65
  plume_stddev: 1.5
  wind_x: 0.18
  wind_y: -0.06
  noise_stddev: 0.03
  gas_type: "H2"
  publish_rate_hz: 5.0
fusion:
  use_fusion: true
  fusion_mode: weighted
  pf_weight: 0.35
  surge_weight: 0.65
  pf_confidence_threshold: 0.3
wind_estimation:
  estimate_wind: gradient   # "gradient" | "anemometer" (CFD truth) | "off"
  min_samples: 8

# Anemometer ground-truth wind from GADEN CFD.
# Enable with use_anemometer_ground_truth:=true at launch time.
# When enabled, set wind_estimation.estimate_wind: "anemometer" above.
anemometer:
  noise_std: 0.1
  frequency: 10.0
  smoothing_alpha: 1.0
  max_wind_speed: 10.0
